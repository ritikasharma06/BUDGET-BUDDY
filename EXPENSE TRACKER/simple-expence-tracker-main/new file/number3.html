<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Expense Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 85%;
            margin: auto;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .login {
            text-align: center;
            margin-top: 100px;
        }
    </style>

</head>

<body>

    <div id="loginPage" class="login">

        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username"><br>
        <input type="password" id="password" placeholder="Password"><br>

        <button onclick="login()">Login</button>
        <button onclick="signup()">Signup</button>

    </div>

    <div class="container" id="app" style="display:none">

        <h1>Simple Expense Tracker</h1>

        <input type="date" id="date">
        <input type="text" id="title" placeholder="Expense Title">

        <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Other</option>
        </select>

        <input type="number" id="amount" placeholder="Amount">

        <button onclick="addExpense()">Add Expense</button>

        <table>

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="list"></tbody>

        </table>

        <div class="total">
            Total: ₹ <span id="total">0</span>
        </div>

        <h3>Expense Chart</h3>

        <canvas id="chart"></canvas>

        <br>

        <button onclick="exportExcel()">Export Excel</button>
        <button onclick="exportPDF()">Export PDF</button>

    </div>

    <script>

        let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

        function signup() {

            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            localStorage.setItem("user", user);
            localStorage.setItem("pass", pass);

            alert("Signup successful");

        }

        function login() {

            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            if (user === localStorage.getItem("user") && pass === localStorage.getItem("pass")) {

                document.getElementById("loginPage").style.display = "none";
                document.getElementById("app").style.display = "block";

                display();
                total();

            } else {
                alert("Invalid login");
            }

        }

        function addExpense() {

            let date = document.getElementById("date").value;
            let title = document.getElementById("title").value;
            let category = document.getElementById("category").value;
            let amount = document.getElementById("amount").value;

            let expense = {
                date, title, category, amount: Number(amount)
            };

            expenses.push(expense);

            localStorage.setItem("expenses", JSON.stringify(expenses));

            display();
            total();
            chart();

        }

        function display() {

            let list = document.getElementById("list");

            list.innerHTML = "";

            expenses.forEach((e, i) => {

                list.innerHTML += `

<tr>

<td>${e.date}</td>
<td>${e.title}</td>
<td>${e.category}</td>
<td>₹${e.amount}</td>

<td>
<button onclick="edit(${i})">Edit</button>
<button onclick="del(${i})">Delete</button>
</td>

</tr>

`;

            });

        }

        function total() {

            let t = 0;

            expenses.forEach(e => {

                t += e.amount;

            });

            document.getElementById("total").innerText = t;

        }

        function del(i) {

            expenses.splice(i, 1);

            localStorage.setItem("expenses", JSON.stringify(expenses));

            display();
            total();
            chart();

        }

        function edit(i) {

            let e = expenses[i];

            document.getElementById("date").value = e.date;
            document.getElementById("title").value = e.title;
            document.getElementById("category").value = e.category;
            document.getElementById("amount").value = e.amount;

            del(i);

        }

        function chart() {

            let categories = {};

            expenses.forEach(e => {

                categories[e.category] = (categories[e.category] || 0) + e.amount;

            });

            let ctx = document.getElementById("chart");

            new Chart(ctx, {

                type: "pie",

                data: {
                    labels: Object.keys(categories),

                    datasets: [{
                        data: Object.values(categories)
                    }]
                }

            });

        }

        function exportExcel() {

            let ws = XLSX.utils.json_to_sheet(expenses);
            let wb = XLSX.utils.book_new();

            XLSX.utils.book_append_sheet(wb, ws, "Expenses");

            XLSX.writeFile(wb, "expenses.xlsx");

        }

        function exportPDF() {

            const { jsPDF } = window.jspdf;

            let doc = new jsPDF();

            let y = 10;

            expenses.forEach(e => {

                doc.text(`${e.date} ${e.title} ${e.category} ${e.amount}`, 10, y);

                y += 10;

            });

            doc.save("expenses.pdf");

        }

        display();
        total();
        chart();

    </script>

</body>

</html>
